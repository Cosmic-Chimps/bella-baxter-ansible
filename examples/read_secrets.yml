---
# examples/read_secrets.yml
#
# Example playbook: read secrets from Bella Baxter and use them in tasks.
#
# Usage
# -----
#   # Option A — pass credentials as extra-vars
#   ansible-playbook read_secrets.yml \
#     -e baxter_url=https://baxter.example.com \
#     -e bella_api_key=bella_ak_abc123 \
#     -e "bella_api_key=s3cr3t"
#
#   # Option B — export environment variables (recommended for CI/CD)
#   export BELLA_BAXTER_URL=https://baxter.example.com
#   export BELLA_API_KEY=bella_ak_abc123
#   export BELLA_API_KEY=s3cr3t
#   export BELLA_ENV_SLUG=production
#   ansible-playbook read_secrets.yml
#
# Prerequisites
# -------------
#   pip install bella-baxter
#   ansible-galaxy collection install cosmic_chimps.bella

- name: Provision application using secrets from Bella Baxter
  hosts: app_servers
  gather_facts: false

  vars:
    # --- Bella Baxter connection (fallback to env vars if not set) ---
    baxter_url: "{{ lookup('env', 'BELLA_BAXTER_URL') | default('') }}"
    bella_api_key: "{{ lookup('env', 'BELLA_API_KEY') | default('') }}"
    bella_api_key: "{{ lookup('env', 'BELLA_API_KEY') | default('') }}"
    bella_env_slug: "{{ lookup('env', 'BELLA_ENV_SLUG') | default('production') }}"

    # --- Secrets fetched from Bella Baxter ---
    # A single API call fetches ALL secrets; individual key lookups are free.
    database_url: "{{ lookup('cosmic_chimps.bella.secret', 'DATABASE_URL',
                       baxter_url=baxter_url,
                       environment_slug=bella_env_slug,
                       api_key=bella_api_key,
                       
) }}"

    redis_url: "{{ lookup('cosmic_chimps.bella.secret', 'REDIS_URL',
                    baxter_url=baxter_url,
                    environment_slug=bella_env_slug,
                    api_key=bella_api_key,
                    
) }}"

    stripe_key: "{{ lookup('cosmic_chimps.bella.secret', 'STRIPE_SECRET_KEY',
                     baxter_url=baxter_url,
                     environment_slug=bella_env_slug,
                     api_key=bella_api_key,
                     
) }}"

  tasks:
    - name: Verify secrets were resolved
      ansible.builtin.assert:
        that:
          - database_url | length > 0
          - redis_url | length > 0
          - stripe_key | length > 0
        fail_msg: "One or more required secrets were empty — check Bella Baxter config"
        success_msg: "All required secrets resolved successfully"

    - name: Write application .env file
      ansible.builtin.template:
        dest: /opt/myapp/.env
        mode: "0600"
        owner: myapp
        group: myapp
        content: |
          DATABASE_URL={{ database_url }}
          REDIS_URL={{ redis_url }}
          STRIPE_SECRET_KEY={{ stripe_key }}
          APP_ENV={{ bella_env_slug }}
      no_log: true   # never log the rendered file — it contains secrets

    - name: Restart application to pick up new config
      ansible.builtin.service:
        name: myapp
        state: restarted

    - name: Confirm service is running
      ansible.builtin.service_facts:

    - name: Assert myapp is active
      ansible.builtin.assert:
        that: ansible_facts.services['myapp.service'].state == 'running'
        fail_msg: "myapp failed to start after config update"


