---
# provision_ssh_trust.yml
#
# Bella Baxter — SSH Certificate Authority Trust Playbook
#
# This playbook does two things:
#
#   1. SERVER SETUP (hosts: ssh_servers)
#      Fetches the SSH CA public key from Bella Baxter and configures
#      every target SSH server to trust certificates signed by that CA.
#
#   2. CLIENT SETUP (hosts: localhost)
#      Signs the operator's local SSH public key so it can be used to
#      connect to the trusted servers immediately after.
#
# Prerequisites:
#   - pip install requests
#   - Set environment variables (or pass as extra vars):
#       BELLA_BAXTER_URL    — e.g. https://baxter.example.com
#       BELLA_API_KEY       — bax-... API key
#       BELLA_PROJECT_SLUG  — project slug (e.g. my-app)
#       BELLA_ENV_SLUG      — environment slug (e.g. production)
#       BELLA_SSH_ROLE      — SSH role name (e.g. ops-team)
#
# Usage:
#   ansible-playbook provision_ssh_trust.yml \
#     -e "bella_project_slug=my-app bella_env_slug=production bella_ssh_role=ops-team" \
#     -i inventory.ini
#
# Inventory groups:
#   [ssh_servers]  — machines that should trust the CA
#   [localhost]    — implied (sign local key for immediate access)

- name: Configure SSH CA trust on servers
  hosts: ssh_servers
  become: true
  gather_facts: false

  vars:
    bella_baxter_url: "{{ lookup('env', 'BELLA_BAXTER_URL') | default(baxter_url | default('')) }}"
    bella_api_key: "{{ lookup('env', 'BELLA_API_KEY') | default('') }}"
    bella_project_slug: "{{ lookup('env', 'BELLA_PROJECT_SLUG') | default('') }}"
    bella_env_slug: "{{ lookup('env', 'BELLA_ENV_SLUG') | default('') }}"
    trusted_ca_path: /etc/ssh/trusted-user-ca-keys.pem

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.fail:
        msg: "{{ item }} must be set (env var or extra var)"
      when: vars[item] == ''
      loop:
        - bella_baxter_url
        - bella_api_key
        - bella_project_slug
        - bella_env_slug

    - name: Fetch SSH CA public key from Bella Baxter
      ansible.builtin.set_fact:
        bella_ca_public_key: >-
          {{ lookup('jjchiw.bella_baxter.ssh_ca_key',
               project_slug=bella_project_slug,
               environment_slug=bella_env_slug,
               baxter_url=bella_baxter_url,
               api_key=bella_api_key,
               
) }}
      delegate_to: localhost
      run_once: true

  tasks:
    - name: Write trusted SSH CA public key
      ansible.builtin.copy:
        dest: "{{ trusted_ca_path }}"
        content: "{{ bella_ca_public_key }}\n"
        owner: root
        group: root
        mode: "0644"
      notify: Reload sshd

    - name: Ensure TrustedUserCAKeys is set in sshd_config
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*TrustedUserCAKeys'
        line: "TrustedUserCAKeys {{ trusted_ca_path }}"
        state: present
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Ensure AuthorizedPrincipalsFile is set (optional but recommended)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?\s*AuthorizedPrincipalsFile'
        line: "AuthorizedPrincipalsFile none"
        state: present
      notify: Reload sshd

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
        state: reloaded


- name: Sign operator SSH key for immediate access
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    bella_baxter_url: "{{ lookup('env', 'BELLA_BAXTER_URL') | default(baxter_url | default('')) }}"
    bella_api_key: "{{ lookup('env', 'BELLA_API_KEY') | default('') }}"
    bella_project_slug: "{{ lookup('env', 'BELLA_PROJECT_SLUG') | default('') }}"
    bella_env_slug: "{{ lookup('env', 'BELLA_ENV_SLUG') | default('') }}"
    bella_ssh_role: "{{ lookup('env', 'BELLA_SSH_ROLE') | default(ssh_role | default('ops-team')) }}"
    # Path to the SSH public key to sign. Defaults to ed25519, falls back to rsa.
    ssh_pub_key_path: >-
      {{ lookup('env', 'HOME') + '/.ssh/id_ed25519.pub'
         if (lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') is file
         else lookup('env', 'HOME') + '/.ssh/id_rsa.pub' }}

  pre_tasks:
    - name: Validate required variables for signing
      ansible.builtin.fail:
        msg: "{{ item }} must be set"
      when: vars[item] == ''
      loop:
        - bella_baxter_url
        - bella_api_key
        - bella_project_slug
        - bella_env_slug

    - name: Check that SSH public key exists
      ansible.builtin.stat:
        path: "{{ ssh_pub_key_path }}"
      register: pubkey_stat

    - name: Fail if public key not found
      ansible.builtin.fail:
        msg: "SSH public key not found at {{ ssh_pub_key_path }}. Generate one with: ssh-keygen -t ed25519"
      when: not pubkey_stat.stat.exists

  tasks:
    - name: Read local SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_pub_key_path }}"
      register: pubkey_content

    - name: Sign SSH public key via Bella Baxter
      ansible.builtin.set_fact:
        signed_certificate: >-
          {{ lookup('jjchiw.bella_baxter.ssh_sign',
               project_slug=bella_project_slug,
               environment_slug=bella_env_slug,
               role_name=bella_ssh_role,
               public_key=(pubkey_content.content | b64decode).strip(),
               baxter_url=bella_baxter_url,
               api_key=bella_api_key,
               
) }}

    - name: Derive certificate path (foo.pub → foo-cert.pub)
      ansible.builtin.set_fact:
        ssh_cert_path: "{{ ssh_pub_key_path | regex_replace('\\.pub$', '-cert.pub') }}"

    - name: Write signed SSH certificate to disk
      ansible.builtin.copy:
        dest: "{{ ssh_cert_path }}"
        content: "{{ signed_certificate }}\n"
        mode: "0600"

    - name: Show connection instructions
      ansible.builtin.debug:
        msg: |
          ✓ SSH certificate written to {{ ssh_cert_path }}

          Connect using:
            ssh -i {{ ssh_pub_key_path | regex_replace('\\.pub$', '') }} \
                -o CertificateFile={{ ssh_cert_path }} \
                <user>@<host>
